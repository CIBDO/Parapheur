# ONLYOFFICE Document Server — développement local (Temps 2)
# Usage : docker compose -f docker-compose.yml up -d
# Docs UI : http://localhost:8080
# Laravel doit être joignable via ONLYOFFICE_APP_URL
# (ex. http://host.docker.internal:8000) et écouter sur 0.0.0.0:8000.
#
# JWT_SECRET doit être fourni via .env (ONLYOFFICE_JWT_SECRET, ≥ 32 caractères).
# Génération : php artisan onlyoffice:generate-jwt-secret

services:
  onlyoffice:
    # Évitez `docker compose pull` sans besoin : :latest peut changer le comportement.
    # Pour figer : onlyoffice/documentserver:8.2.0 (vérifier le tag sur Docker Hub).
    image: onlyoffice/documentserver:latest
    container_name: eparapheur-onlyoffice
    ports:
      - "127.0.0.1:8080:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in .env}
      # Header standard — DocsAPI l’utilise nativement (AuthorizationJwt peut bloquer l’ouverture)
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  onlyoffice_db:
